[package]
name = "isc_pack_v4"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
hex = "0.4"
rand = "0.8"
chrono = { version = "0.4", features = ["alloc"] }
reqwest = { version = "0.11", features = ["blocking"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
