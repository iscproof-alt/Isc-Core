[package]
name = "isc_verify"
version = "0.2.0"
edition = "2021"

[dependencies]
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
ssh-key = { version = "0.6", features = ["ed25519"] }

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
